name: Automatic Website Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Download the latest code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Deploy website files to Apache Virtual Host directory
      - name: Deploy Website
        run: |
          sudo rm -rf /var/www/website1/*
          sudo cp -r ./* /var/www/website1/

      # Restart Apache to apply changes
      - name: Restart Apache
        run: |
          sudo systemctl restart apache2

      # Verify Apache is running
      - name: Verify Apache
        run: |
          sudo systemctl status apache2 --no-pagername: Automatic Website Deployment

